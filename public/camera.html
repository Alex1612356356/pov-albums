<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FDMS Albums">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/pwa-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <title>Cameră eveniment</title>
</head>
<body class="camera-app">
<main class="camera-shell">
  <header class="camera-header">
    <button id="openLibrary" class="camera-icon-button" type="button" aria-label="Alege poze și videoclipuri">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m21 15-5-5L5 20"></path></svg>
    </button>
    <div class="camera-event">
      <span class="camera-event-label">EVENIMENT</span>
      <strong id="title">SE ÎNCARCĂ…</strong>
    </div>
    <span id="recordingLight" class="camera-live-dot" aria-label="Cameră eveniment"></span>
  </header>

  <section class="camera-stage" aria-label="Cameră foto și video">
    <div class="camera-view" id="cameraView">
      <video id="preview" autoplay muted playsinline aria-label="Previzualizare cameră"></video>
      <div class="camera-placeholder" id="cameraPlaceholder">
        <span class="camera-symbol" aria-hidden="true">◉</span>
        <p>Camera evenimentului</p>
        <button id="startCamera" class="camera-start-button" type="button">Pornește camera</button>
      </div>
      <p id="scheduleMessage" class="schedule-message" role="status">Se verifică programul…</p>
      <span id="recordingBadge" class="recording-badge" hidden><span></span> REC <time id="recordingTime">00:00</time></span>
      <p id="cameraError" class="camera-error" role="alert"></p>
    </div>
  </section>

  <section class="camera-dock" aria-label="Comenzi cameră">
    <div class="camera-modes" role="group" aria-label="Mod captură">
      <button class="camera-mode is-selected" type="button" data-mode="photo" aria-pressed="true">FOTO</button>
      <button class="camera-mode" type="button" data-mode="video" aria-pressed="false">VIDEO</button>
    </div>
    <div class="camera-controls">
      <button id="recentButton" class="camera-recent" type="button" aria-label="Deschide momentele tale" title="Momentele tale" hidden>
        <img id="recentThumbnail" alt="">
        <video id="recentVideo" muted playsinline hidden></video>
        <span id="uploadCount" class="recent-count">0</span>
      </button>
      <span id="recentPlaceholder" class="camera-recent is-empty" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m21 15-5-5L5 20"></path></svg></span>
      <button id="photoButton" class="shutter-button" type="button" aria-label="Fă fotografie"><span class="photo-shutter"></span></button>
      <button id="recordButton" class="shutter-button video-shutter" type="button" aria-label="Începe înregistrarea video" hidden><span class="video-shutter-inner"></span></button>
      <button id="switchCameraBottom" class="camera-icon-button camera-flip-button" type="button" aria-label="Întoarce camera" title="Întoarce camera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-3l-2-2H9L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </button>
    </div>
    <p id="cameraStatus" class="camera-status" role="status" aria-live="polite">Atinge „Pornește camera” pentru a începe.</p>
    <details class="camera-more">
      <summary>Mai multe opțiuni</summary>
      <div class="fallback-controls">
        <label class="camera-option" for="cameraPhoto">Fă o fotografie</label>
        <input id="cameraPhoto" type="file" accept="image/*" capture="environment" hidden>
        <label class="camera-option" for="cameraVideo">Înregistrează un videoclip</label>
        <input id="cameraVideo" type="file" accept="video/*" capture="environment" hidden>
        <label class="camera-option" for="pick">Alege din Poze</label>
        <input id="pick" type="file" accept="image/*,video/*" multiple hidden>
      </div>
    </details>
    <p id="uploadStatus" class="upload-status" role="status" aria-live="polite"></p>
  </section>

  <section id="myMoments" class="moments-sheet" aria-label="Momentele încărcate de pe acest telefon" hidden>
    <div class="moments-sheet-card">
      <div class="section-heading"><div><p class="eyebrow">MOMENTELE TALE</p><h2>De pe acest telefon</h2></div><button id="closeMoments" class="camera-icon-button" type="button" aria-label="Închide momentele">×</button></div>
      <div class="grid" id="mine"></div>
    </div>
  </section>
</main>
<script>
const albumId = location.pathname.split('/')[2];
const preview = document.getElementById('preview');
const photoButton = document.getElementById('photoButton');
const recordButton = document.getElementById('recordButton');
const startCameraButton = document.getElementById('startCamera');
const switchCameraButton = document.getElementById('switchCameraBottom');
const openLibraryButton = document.getElementById('openLibrary');
const cameraStatus = document.getElementById('cameraStatus');
const cameraError = document.getElementById('cameraError');
const recordingBadge = document.getElementById('recordingBadge');
const recordingTime = document.getElementById('recordingTime');
const recordingLight = document.getElementById('recordingLight');
const uploadStatus = document.getElementById('uploadStatus');
const uploadCount = document.getElementById('uploadCount');
const recentButton = document.getElementById('recentButton');
const recentPlaceholder = document.getElementById('recentPlaceholder');
const recentThumbnail = document.getElementById('recentThumbnail');
const recentVideo = document.getElementById('recentVideo');
const mine = document.getElementById('mine');
let stream;
let recorder;
let recordingChunks = [];
let recordStartedAt = 0;
let recordTimer;
let facingMode = 'environment';
let uploadQueue = [];
let uploading = false;
let requestingVideoAudio = false;
let sent = 0;
let captureMode = 'photo';
let uploadWindowOpen = false;
let opensAt = 0;
let closesAt = 0;
let windowRefreshTimer;

function canCaptureNow() {
  const now = Date.now();
  return uploadWindowOpen && now >= opensAt && now < closesAt;
}

function updateCameraControls() {
  const available = canCaptureNow();
  const recording = recorder && recorder.state === 'recording';
  const controlsBusy = recording || requestingVideoAudio;
  photoButton.disabled = !available || !stream || captureMode !== 'photo';
  recordButton.disabled = !available || !stream || captureMode !== 'video' || requestingVideoAudio;
  photoButton.hidden = captureMode !== 'photo';
  recordButton.hidden = captureMode !== 'video';
  document.getElementById('pick').disabled = !available;
  document.getElementById('cameraPhoto').disabled = !available;
  document.getElementById('cameraVideo').disabled = !available;
  openLibraryButton.disabled = !available || controlsBusy;
  startCameraButton.disabled = !available;
  switchCameraButton.disabled = !available || !stream || controlsBusy;
  document.querySelectorAll('.camera-mode').forEach(button => { button.disabled = !available || controlsBusy; });
  if (!available && stream) {
    if (recorder && recorder.state === 'recording') recorder.stop();
    stopStream();
    cameraStatus.textContent = 'Camera este oprită în afara programului.';
  }
}

async function loadAlbum() {
  try {
    const response = await fetch('/api/a/' + albumId);
    if (!response.ok) throw new Error('Nu am putut deschide albumul.');
    const album = await response.json();
    document.getElementById('title').textContent = album.name;
    document.title = album.name + ' | FDMS Albums';
    applyUploadWindow(album);
  } catch (error) {
    cameraError.textContent = error.message;
  }
}

function applyUploadWindow(status) {
  uploadWindowOpen = status.canUpload;
  opensAt = status.opensAt || 0;
  closesAt = status.closesAt || 0;
  const message = document.getElementById('scheduleMessage');
  if (status.reason === 'open') {
    const closeTime = new Intl.DateTimeFormat('ro-RO', { timeZone: status.schedule.timeZone, hour: '2-digit', minute: '2-digit' }).format(new Date(status.closesAt));
    message.textContent = 'Program activ · până la ' + closeTime;
    message.className = 'schedule-message is-open';
  } else if (status.reason === 'not-open') {
    message.textContent = 'Camera se deschide pe ' + status.schedule.eventDate + ' la ' + status.schedule.startTime + ' · ' + status.schedule.timeZone;
    message.className = 'schedule-message';
  } else if (status.reason === 'closed') {
    message.textContent = 'Programul de fotografiere și încărcare s-a încheiat.';
    message.className = 'schedule-message';
  } else if (status.reason === 'invalid-local-time') {
    message.textContent = 'Ora configurată nu există în fusul orar ales. Contactează organizatorul.';
    message.className = 'schedule-message is-error';
  } else {
    message.textContent = 'Organizatorul nu a configurat încă programul evenimentului.';
    message.className = 'schedule-message';
  }
  updateCameraControls();
  if (canCaptureNow()) processQueue();
}

async function refreshUploadWindow() {
  try {
    const response = await fetch('/api/a/' + albumId);
    if (!response.ok) throw new Error('Nu am putut verifica programul albumului.');
    applyUploadWindow(await response.json());
  } catch (error) {
    uploadWindowOpen = false;
    opensAt = 0;
    closesAt = 0;
    updateCameraControls();
    cameraError.textContent = error.message;
  }
}

function stopStream() {
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = undefined;
  preview.srcObject = null;
  preview.classList.remove('is-live');
  document.getElementById('cameraPlaceholder').hidden = false;
  switchCameraButton.hidden = true;
  startCameraButton.hidden = false;
}

async function startCamera() {
  cameraError.textContent = '';
  if (!canCaptureNow()) {
    cameraError.textContent = 'Camera este disponibilă doar în programul stabilit de organizator.';
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    cameraError.textContent = 'Camera live necesită HTTPS. Poți folosi butoanele pentru camera telefonului de mai jos.';
    return;
  }
  startCameraButton.disabled = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        frameRate: { ideal: 30, max: 30 },
      },
      audio: false
    });
    if (!canCaptureNow()) {
      stopStream();
      cameraStatus.textContent = 'Camera este oprită în afara programului.';
      return;
    }
    preview.srcObject = stream;
    await preview.play();
    preview.classList.add('is-live');
    document.getElementById('cameraPlaceholder').hidden = true;
    switchCameraButton.hidden = false;
    startCameraButton.hidden = true;
    cameraStatus.textContent = 'Camera este activă. Fă mai multe fotografii și filmări una după alta.';
    updateCameraControls();
  } catch (error) {
    const message = error.name === 'NotAllowedError'
      ? 'Permite accesul la cameră și microfon pentru a continua.'
      : error.name === 'NotFoundError'
        ? 'Nu am găsit o cameră disponibilă pe acest dispozitiv.'
        : 'Camera nu a pornit. Verifică permisiunile browserului și încearcă din nou.';
    cameraError.textContent = message;
    startCameraButton.hidden = false;
  } finally {
    updateCameraControls();
  }
}

function enqueue(file) {
  const url = URL.createObjectURL(file);
  recentButton.hidden = false;
  recentPlaceholder.hidden = true;
  recentThumbnail.hidden = file.type.startsWith('video/');
  recentVideo.hidden = !file.type.startsWith('video/');
  if (file.type.startsWith('video/')) {
    recentVideo.src = url;
    recentVideo.onloadedmetadata = () => {
      recentVideo.currentTime = Math.min(0.1, recentVideo.duration / 2);
    };
  } else {
    recentThumbnail.src = url;
  }
  const item = document.createElement('a');
  item.className = 'upload-item is-uploading';
  item.href = url;
  item.target = '_blank';
  item.rel = 'noreferrer';
  item.setAttribute('aria-label', 'Deschide fișierul încărcat');
  const media = document.createElement(file.type.startsWith('video/') ? 'video' : 'img');
  media.src = url;
  if (media.tagName === 'VIDEO') media.muted = true;
  item.append(media);
  const badge = document.createElement('span');
  badge.className = 'upload-badge';
  badge.textContent = 'ÎN COADĂ';
  item.append(badge);
  mine.prepend(item);
  uploadQueue.push({ file, item, badge });
  uploadCount.textContent = String(sent + uploadQueue.length);
  processQueue();
}

async function processQueue() {
  if (uploading || !uploadQueue.length || !canCaptureNow()) return;
  uploading = true;
  const upload = uploadQueue.shift();
  upload.badge.textContent = 'SE ÎNCARCĂ';
  uploadStatus.textContent = 'Se încarcă ' + upload.file.name + '…';
  const data = new FormData();
  data.append('photos', upload.file, upload.file.name);
  const request = new XMLHttpRequest();
  request.upload.onprogress = event => {
    if (event.lengthComputable) uploadStatus.textContent = 'Se încarcă… ' + Math.round(event.loaded / event.total * 100) + '%';
  };
  request.onload = () => {
    if (request.status >= 200 && request.status < 300) {
      upload.item.classList.remove('is-uploading');
      upload.item.classList.add('is-uploaded');
      upload.badge.textContent = 'ÎNCĂRCAT';
      sent += 1;
      uploadCount.textContent = String(sent + uploadQueue.length);
      uploadStatus.textContent = 'Încărcat cu succes ✓';
    } else {
      upload.item.classList.remove('is-uploading');
      upload.item.classList.add('is-failed');
      upload.badge.textContent = 'REÎNCEARCĂ';
      upload.item.addEventListener('click', event => {
        event.preventDefault();
        upload.item.remove();
        enqueue(upload.file);
      }, { once: true });
      uploadStatus.textContent = 'Încărcarea a eșuat. Atinge previzualizarea pentru a reîncerca.';
    }
    uploading = false;
    processQueue();
  };
  request.onerror = () => {
    upload.item.classList.remove('is-uploading');
    upload.item.classList.add('is-failed');
    upload.badge.textContent = 'REÎNCEARCĂ';
    upload.item.addEventListener('click', event => {
      event.preventDefault();
      upload.item.remove();
      enqueue(upload.file);
    }, { once: true });
    uploadStatus.textContent = 'Conexiune întreruptă. Atinge previzualizarea pentru a reîncerca.';
    uploading = false;
    processQueue();
  };
  request.open('POST', '/api/a/' + albumId + '/photos');
  request.send(data);
}

function setCaptureMode(mode) {
  captureMode = mode;
  document.querySelectorAll('.camera-mode').forEach(button => {
    const selected = button.dataset.mode === mode;
    button.classList.toggle('is-selected', selected);
    button.setAttribute('aria-pressed', String(selected));
  });
  updateCameraControls();
}

function showMyMoments() {
  document.getElementById('myMoments').hidden = false;
}

function addFiles(files) {
  if (!canCaptureNow()) {
    cameraError.textContent = 'Fotografiile și videoclipurile pot fi încărcate doar în programul evenimentului.';
    return;
  }
  Array.from(files).forEach(file => {
    if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) return;
    enqueue(file);
  });
}

function takePhoto() {
  if (!canCaptureNow() || !stream || !preview.videoWidth) return;
  const canvas = document.createElement('canvas');
  canvas.width = preview.videoWidth;
  canvas.height = preview.videoHeight;
  canvas.getContext('2d').drawImage(preview, 0, 0);
  canvas.toBlob(blob => {
    if (!blob) {
      cameraError.textContent = 'Nu am putut salva fotografia. Încearcă din nou.';
      return;
    }
    addFiles([new File([blob], 'fdms-' + new Date().toISOString().replace(/[:.]/g, '-') + '.jpg', { type: 'image/jpeg' })]);
  }, 'image/jpeg', .92);
}

function getRecordingType() {
  const types = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  return types.find(type => MediaRecorder.isTypeSupported(type)) || '';
}

function updateRecordingTime() {
  const seconds = Math.floor((Date.now() - recordStartedAt) / 1000);
  recordingTime.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
}

function stopMicrophoneTracks() {
  if (!stream) return;
  stream.getAudioTracks().forEach(track => {
    track.stop();
    stream.removeTrack(track);
  });
}

async function toggleRecording() {
  cameraError.textContent = '';
  if (!canCaptureNow()) {
    cameraError.textContent = 'Filmarea este disponibilă doar în programul stabilit de organizator.';
    return;
  }
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }
  if (!stream || !window.MediaRecorder) {
    cameraError.textContent = 'Filmarea din aplicație nu este disponibilă în acest browser. Folosește butonul „FILMEAZĂ VIDEO” de mai jos.';
    return;
  }
  if (!stream.getAudioTracks().length) {
    requestingVideoAudio = true;
    cameraStatus.textContent = 'Se solicită accesul la microfon pentru video…';
    updateCameraControls();
    try {
      const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      if (!canCaptureNow() || !stream) {
        audioStream.getTracks().forEach(track => track.stop());
        return;
      }
      audioStream.getAudioTracks().forEach(track => stream.addTrack(track));
    } catch (error) {
      cameraError.textContent = error.name === 'NotAllowedError'
        ? 'Permite accesul la microfon pentru a înregistra videoclipuri cu sunet.'
        : 'Nu am putut porni microfonul. Verifică permisiunile browserului și încearcă din nou.';
      return;
    } finally {
      requestingVideoAudio = false;
      updateCameraControls();
    }
  }
  try {
    const mimeType = getRecordingType();
    recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    recordingChunks = [];
    recorder.ondataavailable = event => { if (event.data.size) recordingChunks.push(event.data); };
    recorder.onerror = () => { cameraError.textContent = 'Filmarea s-a oprit din cauza unei erori.'; finishRecordingUI(); };
    recorder.onstop = () => {
      const type = recorder.mimeType || mimeType || 'video/webm';
      const extension = type.includes('mp4') ? 'mp4' : 'webm';
      const video = new File(recordingChunks, 'fdms-' + new Date().toISOString().replace(/[:.]/g, '-') + '.' + extension, { type });
      if (video.size) addFiles([video]);
      finishRecordingUI();
    };
    recorder.start(1000);
    recordStartedAt = Date.now();
    recordingBadge.hidden = false;
    recordingLight.classList.add('is-recording');
    recordButton.classList.add('is-recording');
    recordButton.setAttribute('aria-label', 'Oprește înregistrarea video');
    photoButton.disabled = true;
    recordTimer = setInterval(updateRecordingTime, 500);
    updateRecordingTime();
    updateCameraControls();
  } catch {
    cameraError.textContent = 'Nu am putut porni filmarea. Verifică permisiunile pentru cameră și microfon.';
    stopMicrophoneTracks();
  }
}

function finishRecordingUI() {
  clearInterval(recordTimer);
  stopMicrophoneTracks();
  recordingBadge.hidden = true;
  recordingLight.classList.remove('is-recording');
  recordButton.classList.remove('is-recording');
  recordButton.setAttribute('aria-label', 'Începe înregistrarea video');
  updateCameraControls();
}

async function switchCamera() {
  if (recorder && recorder.state === 'recording') return;
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  stopStream();
  await startCamera();
}

startCameraButton.addEventListener('click', startCamera);
switchCameraButton.addEventListener('click', switchCamera);
openLibraryButton.addEventListener('click', () => document.getElementById('pick').click());
recentButton.addEventListener('click', showMyMoments);
document.getElementById('closeMoments').addEventListener('click', () => { document.getElementById('myMoments').hidden = true; });
document.getElementById('myMoments').addEventListener('click', event => {
  if (event.target.id === 'myMoments') event.currentTarget.hidden = true;
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') document.getElementById('myMoments').hidden = true;
});
document.querySelectorAll('.camera-mode').forEach(button => button.addEventListener('click', () => setCaptureMode(button.dataset.mode)));
photoButton.addEventListener('click', takePhoto);
recordButton.addEventListener('click', toggleRecording);
document.getElementById('pick').addEventListener('change', event => {
  addFiles(event.target.files);
  event.target.value = '';
});
document.getElementById('cameraPhoto').addEventListener('change', event => {
  addFiles(event.target.files);
  event.target.value = '';
});
document.getElementById('cameraVideo').addEventListener('change', event => {
  addFiles(event.target.files);
  event.target.value = '';
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
photoButton.disabled = true;
recordButton.disabled = true;
loadAlbum();
windowRefreshTimer = setInterval(refreshUploadWindow, 15000);
setInterval(updateCameraControls, 1000);

window.addEventListener('pagehide', () => {
  if (recorder && recorder.state === 'recording') recorder.stop();
  stopStream();
  clearInterval(windowRefreshTimer);
  mine.querySelectorAll('a').forEach(item => URL.revokeObjectURL(item.href));
  if (recentThumbnail.src.startsWith('blob:')) URL.revokeObjectURL(recentThumbnail.src);
  if (recentVideo.src.startsWith('blob:')) URL.revokeObjectURL(recentVideo.src);
});
</script>
</body>
</html>
